<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheLink — First Encounter</title><style>*{box-sizing:border-box}html,body{margin:0;font-family:Arial,"Noto Sans Arabic","Noto Sans Hebrew",sans-serif;background:transparent;color:#f7f7f7}body{padding:14px}.card{max-width:820px;margin:auto;background:#111;border:1px solid #2a2a2a;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.3);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #2a2a2a}.brand{font-weight:900;letter-spacing:.05em}.lang{display:flex;gap:6px}.lang button,.nav button{border:1px solid #3a3a3a;background:#1b1b1b;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.lang button.active{background:#fff;color:#111}.content{padding:24px}.step{font-size:13px;color:#aaa;font-weight:800}.title{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:8px 0 16px}.body{font-size:18px;line-height:1.72;white-space:pre-line}.tip{margin-top:16px;padding:14px;border:1px solid #333;border-radius:14px;background:#181818;color:#ddd}.nav{display:flex;justify-content:space-between;padding:0 24px 24px}.nav button:disabled{opacity:.3}.accent{color:#b7ff55;font-weight:900}</style></head><body><div class="card"><div class="top"><div class="brand">THE LINK</div><div class="lang"><button data-lang="he">עברית</button><button data-lang="ar">العربية</button></div></div><div class="content"><div class="step" id="step"></div><h1 class="title" id="title"></h1><div class="body" id="body"></div><div class="tip" id="tip"></div></div><div class="nav"><button id="prev">←</button><button id="next">→</button></div></div><script>const S={he:[{t:'לכל אחד ואחת יש משהו ייחודי להביא',b:'בחרו דימוי או תמונה שמספרים משהו קטן עליכם — משהו שמעניין אתכם, מסקרן אתכם או שאתם אוהבים. הוסיפו ליד התמונה כמה מילים קצרות.',tip:'המטרה היא להשאיר עקבה קטנה משלכם במרחב המשותף.'},{t:'ארבע תמונות — משטח אחד',b:'מקמו את ארבע התמונות קרוב זו לזו על המשטח המשותף. תנו לכל תמונה בערך רבע מהמשטח. אם תמונה גדולה מדי, הקטינו אותה בגרירת אחת הפינות פנימה.',tip:'ודאו שלכל אחד ואחת ברביעייה יש תמונה וטקסט קצר.'},{t:'אפשר למצוא תמונה בגוגל',b:'אין לכם תמונה מוכנה? חפשו ב־Google Images תמונה שמתאימה למה שאתם רוצים להביא. שמרו אותה למחשב ואז העלו אותה למשטח.',tip:'בחרו תמונה שקל לכם להסביר למה היא קשורה אליכם.'},{t:'אפשר גם להעלות מהטלפון',b:'רוצים להעלות תמונה מהטלפון? העתיקו מהמחשב את כתובת החדר, שלחו אותה לעצמכם ב־WhatsApp או בדרך נוחה אחרת, פתחו את הקישור בטלפון והעלו משם את התמונה.',tip:'חזרו למחשב אחרי שהתמונה עלתה.'},{t:'עכשיו מסתכלים על הזוג האחר',b:'בחרו תמונה אחת שהעלה מישהו או מישהי מהזוג האחר ושמסקרנת אתכם. לחצו על אייקון העט ובחרו במצב ∞ — סימן האינסוף — כדי שהסימון יישאר. סמנו ליד התמונה וכתבו את האות הראשונה של השם שלכם.',tip:'כדי לצאת ממצב העט ולחזור לתנועה רגילה, לחצו שוב על אייקון העט.'},{t:'סיימתם',b:'הסתכלו רגע על ארבע התמונות ועל הסימונים שנשארו. לאחר שסיימתם, לחצו שוב על סמל העץ כדי לסגור את כלי המשטח ולחזור לתנועה רגילה במרחב.',tip:'השאירו את מה שיצרתם — זו העקבה הראשונה של הרביעייה שלכם.'}],ar:[{t:'لكل واحد وواحدة شيء مميّز يقدّمه',b:'اختاروا صورة أو مشهدًا يروي شيئًا صغيرًا عنكم — شيئًا يهمكم أو يثير فضولكم أو تحبونه. أضيفوا بجانب الصورة بضع كلمات قصيرة.',tip:'الهدف هو ترك أثر صغير من عالمكم في المساحة المشتركة.'},{t:'أربع صور — سطح واحد',b:'ضعوا الصور الأربع قريبًا من بعضها على السطح المشترك. أعطوا كل صورة نحو ربع المساحة. إذا كانت الصورة كبيرة جدًا، صغّروها بسحب إحدى الزوايا إلى الداخل.',tip:'تأكدوا أن لكل واحد وواحدة في الرباعية صورة ونصًا قصيرًا.'},{t:'يمكن العثور على صورة في Google',b:'ليس لديكم صورة جاهزة؟ ابحثوا في Google Images عن صورة تناسب ما تريدون مشاركته. احفظوها على الحاسوب ثم ارفعوها إلى السطح.',tip:'اختاروا صورة يسهل عليكم شرح علاقتها بكم.'},{t:'يمكن الرفع أيضًا من الهاتف',b:'تريدون رفع صورة من الهاتف؟ انسخوا عنوان الغرفة من الحاسوب، أرسلوه لأنفسكم عبر WhatsApp أو بأي طريقة مريحة، افتحوا الرابط في الهاتف وارفعوا الصورة من هناك.',tip:'عودوا إلى الحاسوب بعد رفع الصورة.'},{t:'الآن ننظر إلى الثنائي الآخر',b:'اختاروا صورة رفعها شخص من الثنائي الآخر وأثارت فضولكم. اضغطوا على أيقونة القلم واختاروا وضع ∞ — رمز اللانهاية — لكي يبقى التحديد. ضعوا علامة قرب الصورة واكتبوا الحرف الأول من اسمكم.',tip:'للخروج من وضع القلم والعودة إلى الحركة العادية، اضغطوا مرة أخرى على أيقونة القلم.'},{t:'انتهينا',b:'انظروا للحظة إلى الصور الأربع وإلى العلامات التي بقيت. بعد الانتهاء، اضغطوا مرة أخرى على رمز الشجرة لإغلاق أداة السطح والعودة إلى الحركة العادية في المساحة.',tip:'اتركوا ما أنشأتموه — هذا هو الأثر الأول لرباعيتكم.'}]};let q=new URLSearchParams(location.search),lang=q.get('lang')||localStorage.getItem('thelink-lang')||'he',i=0;if(!['he','ar'].includes(lang))lang='he';function render(){localStorage.setItem('thelink-lang',lang);document.documentElement.lang=lang;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));let s=S[lang][i];step.textContent=`${i+1} / ${S[lang].length}`;title.textContent=s.t;body.textContent=s.b;tip.textContent=s.tip;prev.disabled=i===0;next.disabled=i===S[lang].length-1;let u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<S[lang].length-1){i++;render()}};render();</script></body></html>
