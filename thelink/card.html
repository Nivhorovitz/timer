<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheLink</title><style>html,body{margin:0;min-height:100%;background:transparent;font-family:Arial,sans-serif}.loading{min-height:220px;display:grid;place-items:center;color:#50496e;font-weight:800}.error{margin:24px;padding:18px;border:1px solid #ef4444;border-radius:14px;background:#fff;color:#7f1d1d;direction:rtl}</style></head><body><div class="loading">TheLink…</div><script>(async()=>{const cards={"first-encounter":"first-encounter.html","guided-quartet":"guided-quartet.html","islands":"islands.html","station":"station.html","windows-world":"windows-world.html","update-profile":"update-profile.html"};const q=new URLSearchParams(location.search),key=q.get('card'),file=cards[key];if(!file){document.body.innerHTML='<div class="error">כרטיס לא נמצא</div>';return}try{const u='https://raw.githubusercontent.com/Nivhorovitz/social-interaction-engineering-harness/main/public/thelink-cards/'+file;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();if(!/^\s*<!doctype html/i.test(html))throw new Error('Invalid card source');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="error">לא ניתן לטעון את הכרטיס כרגע.</div>';console.error(e)}})();</script></body></html>
