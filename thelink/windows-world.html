<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheLink — חלונות לעולם שלי</title><style>*{box-sizing:border-box}html,body{margin:0;font-family:Arial,"Noto Sans Arabic","Noto Sans Hebrew",sans-serif;background:transparent;color:#111}body{padding:14px}.card{max-width:820px;margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.12);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #eee}.brand{font-weight:900}.lang{display:flex;gap:6px}.lang button,.btn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.lang button.active,.btn.primary{background:#111;color:#fff;border-color:#111}.content{padding:22px}.step{font-size:13px;font-weight:800;color:#6b7280}.title{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:8px 0 14px}.body{font-size:18px;line-height:1.65;white-space:pre-line}.windows{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.window{border:1px solid #ddd;border-radius:16px;padding:14px;background:#fafafa;cursor:pointer;text-align:right}.window.selected{border-color:#111;background:#111;color:#fff}.window b{display:block;margin-bottom:5px}.nav{display:flex;justify-content:space-between;gap:10px;padding:0 22px 22px}.hint{margin-top:16px;padding:12px 14px;border-radius:14px;background:#f6f7f9;font-weight:700}.memory{display:grid;gap:10px;margin-top:14px}.memory input{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px}@media(max-width:600px){.windows{grid-template-columns:1fr}.content{padding:18px}}</style></head><body><div class="card"><div class="top"><div class="brand">THE LINK</div><div class="lang"><button data-lang="he">עברית</button><button data-lang="ar">العربية</button></div></div><div class="content"><div class="step" id="step"></div><h1 class="title" id="title"></h1><div class="body" id="body"></div><div id="extra"></div></div><div class="nav"><button class="btn" id="prev">←</button><button class="btn primary" id="next">→</button></div></div><script>const W={he:[['חלון השמש','משהו שמאיר לי את היום'],['חלון כוח המשיכה','משהו שמושך אותי שוב ושוב'],['חלון הקפיצה','משהו שהייתי רוצה לנסות'],['חלון המעבדה','משהו שאני אוהב ליצור, לבדוק או לשפר'],['חלון חוק הכוכב','חוק אחד שהייתי מוסיף לעולם חדש'],['חלון המטען','משהו שהייתי לוקח איתי למסע']],ar:[['نافذة الشمس','شيء يضيء يومي'],['نافذة الجاذبية','شيء يجذبني إليه مرارًا'],['نافذة القفزة','شيء أود أن أجرّبه'],['نافذة المختبر','شيء أحب أن أصنعه أو أختبره أو أطوّره'],['نافذة قانون الكوكب','قانون واحد كنت سأضيفه إلى عالم جديد'],['نافذة الحمولة','شيء كنت سأخذه معي في الرحلة']]};const S={he:[{t:'הקוד הפעיל את מצפה הכוכבים',b:'הקוד שפיצחתם באי הצף הפעיל את מצפה הכוכבים. דרך החלונות תוכלו לשלוח זה לזה אותות קטנים מהעולם שלכם. הכוכבים יעזרו לכם בהמשך לבחור עם מי תרצו להמשיך במסע.',next:'בואו נשדר אות ראשון ↓'},{t:'אילו שני חלונות תרצו לפתוח?',b:'כל אחד ואחת בוחרים שני חלונות ושולחים מכל אחד אות קצר. האות הוא רמז — לא כל הסיפור.'},{t:'זוג אחד מתחיל לשדר',b:'מתחלקים לשני הזוגות שהגיעו לרביעייה. הזוג המספר משתף שני אותות קצרים. הזוג הסקרן בוחר איזה חלון מסקרן אותו יותר.',h:'מה מסתתר מאחורי החלון הזה?\nאחרי הסיפור: מה שתפס אותי במה שסיפרת הוא…'},{t:'עכשיו האות מגיע מהצד השני',b:'עכשיו מתחלפים בתפקידים. הזוג הסקרן הופך לזוג המספר, והזוג שסיפר הופך לזוג הסקרן. חוזרים על אותו התהליך.',h:'לפני שממשיכים, ודאו שכל אחת ואחד ברביעייה סיפרו משהו קטן על עצמם.'},{t:'מה תרצו לקחת מהמפגש?',b:'בחרו שני כוכבי זיכרון — רגע, רעיון או פרט קטן שתרצו לזכור ממישהו או ממישהי שפגשתם כאן.'}],ar:[{t:'الرمز فعّل مرصد النجوم',b:'الرمز الذي فككتموه في الجزيرة العائمة فعّل مرصد النجوم. من خلال النوافذ يمكنكم إرسال إشارات صغيرة من عالمكم لبعضكم. ستساعدكم النجوم لاحقًا في اختيار من ترغبون في متابعة الرحلة معه.',next:'لنرسل الإشارة الأولى ↓'},{t:'أي نافذتين تريدون فتحهما؟',b:'يختار كل واحد وكل واحدة نافذتين ويرسل من كل نافذة إشارة قصيرة. الإشارة تلميح — وليست القصة كلها.'},{t:'ثنائي واحد يبدأ بالإرسال',b:'انقسموا إلى الثنائيين اللذين وصلا إلى الرباعية. الثنائي الراوي يشارك إشارتين قصيرتين. الثنائي الفضولي يختار أي نافذة تثير فضوله أكثر.',h:'ماذا يوجد خلف هذه النافذة؟\nبعد القصة: ما لفت انتباهي فيما رويته هو…'},{t:'الآن تصل الإشارة من الجهة الأخرى',b:'الآن تبدّلون الأدوار. الثنائي الفضولي يصبح الثنائي الراوي، والثنائي الذي روى يصبح الثنائي الفضولي. كرروا العملية نفسها.',h:'قبل المتابعة، تأكدوا أن كل واحد وكل واحدة في الرباعية شاركوا شيئًا صغيرًا عن أنفسهم.'},{t:'ماذا تريدون أن تأخذوا معكم من اللقاء؟',b:'اختاروا نجمتَي ذاكرة — لحظة أو فكرة أو تفصيلًا صغيرًا تريدون تذكّره من شخص التقيتم به هنا.'}]};let q=new URLSearchParams(location.search),lang=q.get('lang')||localStorage.getItem('thelink-lang')||'he',i=0,sel=[];if(!['he','ar'].includes(lang))lang='he';function render(){localStorage.setItem('thelink-lang',lang);document.documentElement.lang=lang;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));let s=S[lang][i];step.textContent=`${i+1} / ${S[lang].length}`;title.textContent=s.t;body.textContent=s.b;extra.innerHTML='';if(i===1){let wrap=document.createElement('div');wrap.className='windows';W[lang].forEach((w,n)=>{let b=document.createElement('button');b.className='window'+(sel.includes(n)?' selected':'');b.innerHTML=`<b>${w[0]}</b>${w[1]}`;b.onclick=()=>{sel.includes(n)?sel=sel.filter(x=>x!==n):sel.length<2&&sel.push(n);render()};wrap.appendChild(b)});extra.appendChild(wrap)}if(s.h){let h=document.createElement('div');h.className='hint';h.textContent=s.h;extra.appendChild(h)}if(i===4){let m=document.createElement('div');m.className='memory';m.innerHTML=`<input placeholder="${lang==='he'?'כוכב זיכרון 1':'نجمة ذاكرة 1'}"><input placeholder="${lang==='he'?'כוכב זיכרון 2':'نجمة ذاكرة 2'}">`;extra.appendChild(m)}prev.disabled=i===0;next.textContent=i===0&&s.next?s.next:(i===S[lang].length-1?(lang==='he'?'סיימנו':'أنهينا'):'→');next.disabled=i===S[lang].length-1;let u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i<S[lang].length-1){i++;render()}};render();</script></body></html>
