<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheLink — עדכנו את הפרטים שלכם</title><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,"Noto Sans Arabic","Noto Sans Hebrew",sans-serif;color:#f7f7fb}body{padding:14px}.card{max-width:920px;height:min(78vh,720px);min-height:520px;margin:auto;background:linear-gradient(180deg,#24203e,#17152c);border:1px solid #61558c;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}.card.attention{animation:framePulse 1.15s ease-in-out infinite}@keyframes framePulse{0%,100%{box-shadow:0 0 0 2px rgba(200,255,70,.35),0 18px 50px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 7px rgba(200,255,70,.95),0 0 34px rgba(200,255,70,.75),0 18px 50px rgba(0,0,0,.35)}}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #4b4568;background:rgba(20,18,38,.72)}.brand{font-weight:900}.brand span{color:#c8ff46}.lang{display:flex;gap:6px}.lang button{border:1px solid #625a7d;background:#27243f;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.lang button.active{background:#c8ff46;color:#17152c;border-color:#c8ff46}.scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:30px 28px 36px}.eyebrow{color:#aa8cff;font-size:17px;font-weight:900;margin-bottom:8px}.title{font-size:clamp(32px,6vw,54px);line-height:1.05;margin:0 0 18px}.intro{font-size:20px;line-height:1.6;color:#ddd8ec;margin-bottom:24px}.steps{display:grid;gap:12px}.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;background:#f7f7fb;color:#202239;border-radius:16px;padding:14px 16px}.num{width:40px;height:40px;border-radius:12px;background:#17b7aa;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}.step p{margin:2px 0 0;font-size:18px;line-height:1.55}.what{margin:22px 0 14px;border:2px solid #f5b84b;background:#fff8e8;color:#2f2b2a;border-radius:16px;padding:16px 18px}.what h2{margin:0 0 8px;font-size:22px;color:#b36b00}.what p{margin:0;font-size:18px;line-height:1.55}.save{margin:14px 0;background:#fff8e8;color:#2b2740;border-radius:14px;padding:15px 18px;text-align:center;font-size:20px;font-weight:900}.save code{font-family:inherit;color:#5b47ca}.summary{margin-top:16px;background:#eaf9f5;color:#20383b;border-radius:16px;padding:16px 18px;font-size:18px;line-height:1.55}.hint{text-align:center;padding:10px 18px 14px;color:#c8c2dc;font-size:14px;background:#17152c}@media(max-width:640px){body{padding:8px}.card{height:82vh;min-height:480px}.scroll{padding:24px 18px 30px}.intro{font-size:18px}.step{grid-template-columns:44px 1fr;padding:12px}.num{width:34px;height:34px;font-size:20px}.step p,.what p,.summary{font-size:17px}}@media(prefers-reduced-motion:reduce){.card.attention{animation:none;box-shadow:0 0 0 5px rgba(200,255,70,.8),0 18px 50px rgba(0,0,0,.35)}}</style></head><body><div class="card" id="card"><div class="top"><div class="brand">THE<span>LINK</span></div><div class="lang"><button data-lang="he">עברית</button><button data-lang="ar">العربية</button></div></div><main class="scroll" id="scroll" tabindex="0"><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><div class="intro" id="intro"></div><div class="steps" id="steps"></div><section class="what"><h2 id="whatTitle"></h2><p id="whatBody"></p></section><div class="save" id="save"></div><div class="summary" id="summary"></div></main><div class="hint" id="hint"></div></div><script>const COPY={he:{eyebrow:'הפעולה שלכם עכשיו',title:'עדכנו את הפרטים שלכם',intro:'המטרה שלנו ב־The Link היא להכיר אנשים חדשים וליצור חיבורים. הפרטים שתכתבו יעזרו למשתתפים האחרים להכיר אתכם: לדעת איך קוראים לכם, מאיזה בית ספר אתם ומה מעניין אתכם. כשנכנסתם לספארקו כבר כתבתם את שמכם וכמה מילים על עצמכם. עכשיו נשנה את מה שכתבתם:',steps:['העבירו את הסמן מעל האווטר שלכם — העיגול שמייצג אתכם במרחב.','בחלונית שתופיע, לחצו על ציור העיפרון שבצד ימין.','אם החלונית נעלמה לפני שהספקתם ללחוץ, הזיזו את הסמן מהאווטר והחזירו אותו, והיא תופיע שוב.','בשדה השם כתבו את שמכם הפרטי ואת שם בית הספר שלכם.','בשדה ״על עצמי״ (About me) החליפו את מה שכתבתם וכתבו:'],whatTitle:'מה לכתוב?',whatBody:'משהו שמעניין אתכם ומשהו שאתם טובים בו. לדוגמה: ״מעניין אותי צילום, ואני טובה בלמצוא רעיונות יצירתיים.״',save:'לסיום, לחצו על הכפתור <code>Save Changes</code>',summary:'מעכשיו, כשתעבירו את הסמן מעל האווטר של משתתף או משתתפת, תוכלו לראות איך קוראים להם, מאיזה בית ספר הם ומה הם כתבו על עצמם.',hint:'גללו בתוך הכרטיס כדי לקרוא את כל ההנחיות'},ar:{eyebrow:'الإجراء المطلوب منكم الآن',title:'حدّثوا معلوماتكم',intro:'هدفنا في The Link هو التعرّف إلى أشخاص جدد وبناء روابط. المعلومات التي ستكتبونها ستساعد المشاركين الآخرين على التعرّف إليكم: معرفة أسمائكم، والمدرسة التي تأتون منها، وما الذي يثير اهتمامكم. عندما دخلتم إلى Sparkco كتبتم أسماءكم وبعض الكلمات عن أنفسكم. الآن سنعدّل ما كتبتموه:',steps:['حرّكوا المؤشر فوق الأفاتار الخاص بكم — الدائرة التي تمثّلكم في المساحة.','في النافذة التي ستظهر، اضغطوا على رمز القلم الموجود في الجهة اليمنى.','إذا اختفت النافذة قبل أن تتمكّنوا من الضغط، أبعدوا المؤشر عن الأفاتار ثم أعيدوه إليه، وستظهر النافذة من جديد.','في خانة الاسم، اكتبوا اسمكم الأول واسم مدرستكم.','في خانة «عنّي» (About me)، استبدلوا ما كتبتموه واكتبوا:'],whatTitle:'ماذا تكتبون؟',whatBody:'شيئًا يثير اهتمامكم وشيئًا تتقنونه. مثال: «يهمّني التصوير، وأنا بارعة في إيجاد أفكار إبداعية.»',save:'في النهاية، اضغطوا على زر <code>Save Changes</code>',summary:'من الآن فصاعدًا، عندما تمرّرون المؤشر فوق أفاتار مشارك أو مشاركة، ستتمكّنون من رؤية اسمه أو اسمها، والمدرسة التي يأتي أو تأتي منها، وما كتبه أو كتبته عن نفسه أو نفسها.',hint:'مرّروا داخل البطاقة لقراءة جميع التعليمات'}};let q=new URLSearchParams(location.search),lang=q.get('lang')||localStorage.getItem('thelink-lang')||'he';if(!COPY[lang])lang='he';const seenKey='thelink-update-profile-scrolled';function render(){localStorage.setItem('thelink-lang',lang);document.documentElement.lang=lang;document.documentElement.dir='rtl';document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const c=COPY[lang];eyebrow.textContent=c.eyebrow;title.textContent=c.title;intro.textContent=c.intro;steps.innerHTML='';c.steps.forEach((txt,i)=>{const el=document.createElement('div');el.className='step';el.innerHTML=`<div class="num">${i+1}</div><p>${txt}</p>`;steps.appendChild(el)});whatTitle.textContent=c.whatTitle;whatBody.textContent=c.whatBody;save.innerHTML=c.save;summary.textContent=c.summary;hint.textContent=c.hint;const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}function setAttention(){card.classList.toggle('attention',localStorage.getItem(seenKey)!=='1')}scroll.addEventListener('scroll',()=>{if(scroll.scrollTop>4&&localStorage.getItem(seenKey)!=='1'){localStorage.setItem(seenKey,'1');card.classList.remove('attention')}},{passive:true});document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));render();setAttention();</script></body></html>
