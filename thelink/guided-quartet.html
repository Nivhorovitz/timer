<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheLink — יוצרים רביעייה</title><style>*{box-sizing:border-box}html,body{margin:0;font-family:Arial,"Noto Sans Arabic","Noto Sans Hebrew",sans-serif;background:transparent;color:#f7f7f7}body{padding:14px}.card{max-width:920px;margin:auto;background:linear-gradient(180deg,#24203e,#17152c);border:1px solid #61558c;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px}.brand{font-weight:900;letter-spacing:.04em}.lang{display:flex;gap:6px}.lang button,.btn,.color{border:1px solid #625a7d;background:#27243f;color:#fff;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.lang button.active{background:#c8ff46;color:#17152c;border-color:#c8ff46}.progress-wrap{padding:0 24px}.meta{display:flex;justify-content:space-between;color:#cbc6de;font-weight:800}.bar{height:6px;background:#3a3556;border-radius:999px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,#9f6cff,#c8ff46);width:33%}.content{padding:52px 36px 34px}.eyebrow{color:#aa8cff;font-weight:900;font-size:18px}.title{font-size:clamp(36px,7vw,64px);line-height:1.04;margin:12px 0 18px}.body{font-size:22px;line-height:1.6;color:#d7d2e6;white-space:pre-line}.helper{margin-top:20px;font-size:18px;font-weight:800;color:#f4f1ff}.visual{margin:22px auto 0;max-width:420px;text-align:center}.orb{width:160px;height:160px;margin:auto;border-radius:34px;background:#c8ff46;color:#17152c;display:grid;place-items:center;font-size:58px;box-shadow:0 0 32px rgba(200,255,70,.25)}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.color{border-radius:16px;padding:16px}.color.selected{outline:3px solid #c8ff46}.cta{margin:34px 24px 12px}.btn.primary{width:100%;border-radius:22px;padding:20px;background:#c8ff46;color:#17152c;border-color:#c8ff46;font-size:20px}.btn.primary:disabled{opacity:.45}.note{text-align:center;color:#bbb4ce;padding:0 20px 28px}.langrow{display:flex;gap:8px}.restart{margin-left:auto}.shape{display:grid;place-items:center;min-height:220px}.station{width:210px;height:28px;background:#5aa2ff;border-radius:20px;transform:rotate(-18deg);box-shadow:-70px 18px 0 -6px #403b61}.dot{width:82px;height:82px;border-radius:50%;background:#5aa2ff;margin:0 auto 26px;position:relative}.dot:after{content:'';position:absolute;width:16px;height:16px;background:#17152c;border-radius:50%;top:33px;left:33px}@media(max-width:700px){.colors{grid-template-columns:repeat(2,1fr)}.content{padding:36px 22px}.body{font-size:19px}}</style></head><body><div class="card"><div class="top"><button class="btn restart" id="restart">↻</button><div class="brand">THE<span style="color:#c8ff46">LINK</span></div><div class="langrow lang"><button data-lang="he">עברית</button><button data-lang="ar">العربية</button></div></div><div class="progress-wrap"><div class="meta"><div id="stepLabel"></div><div id="family"></div></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="content"><div class="eyebrow" id="eyebrow"></div><h1 class="title" id="title"></h1><div class="body" id="body"></div><div class="helper" id="helper"></div><div class="visual" id="visual"></div></div><div class="cta"><button class="btn primary" id="next"></button></div><div class="note" id="note"></div></div><script>const COLORS={yellow:{he:'צהוב',ar:'أصفر',heStation:'הצהובה',arStation:'الصفراء',hex:'#ffd356'},blue:{he:'כחול',ar:'أزرق',heStation:'הכחולה',arStation:'الزرقاء',hex:'#5aa2ff'},green:{he:'ירוק',ar:'أخضر',heStation:'הירוקה',arStation:'الخضراء',hex:'#50d6a4'},red:{he:'אדום',ar:'أحمر',heStation:'האדומה',arStation:'الحمراء',hex:'#ef4444'}};const T={he:{family:'יוצרים רביעייה',steps:[{e:'הפעולה שלכם עכשיו',t:'התמקמו יחד בעיגול',b:'שני זוגות נכנסים לאותו עיגול. הסמל שבמרכז הוא הסמל של הקבוצה שלכם.',h:'',n:'לחצו רק אחרי ששני הזוגות בתוך העיגול',btn:'הבנתי, ממשיכים'},{e:'הקבוצה כמעט מוכנה',t:'בחרו צבע',b:'כל אחד ואחת בוחרים צבע אחר. הצבע שלכם יוביל אתכם לתחנה הבאה.',h:'בחרו צבע כדי לראות לאן ממשיכים:',n:'ארבעה משתתפים, ארבעה צבעים שונים',btn:'בחרו צבע כדי להמשיך'},{e:'הצעד האחרון',t:'עברו לתחנה {station}',b:'חפשו במרחב את התחנה בצבע שבחרתם והתקדמו אליה יחד.',h:'',n:'אל תתפזרו — יוצאים יחד כקבוצה',btn:'הגענו לתחנה'}]},ar:{family:'نُشكّل رباعية',steps:[{e:'الإجراء المطلوب منكم الآن',t:'تمركزوا معًا داخل الدائرة',b:'يدخل ثنائيان إلى الدائرة نفسها. الرمز الموجود في الوسط هو رمز مجموعتكم.',h:'',n:'اضغطوا فقط بعد أن يصبح الثنائيان داخل الدائرة',btn:'فهمت، نتابع'},{e:'المجموعة تكاد تصبح جاهزة',t:'اختاروا لونًا',b:'يختار كل واحد وكل واحدة لونًا مختلفًا. لونكم سيقودكم إلى المحطة التالية.',h:'اختاروا لونًا لتروا إلى أين تتابعون:',n:'أربعة مشاركين، أربعة ألوان مختلفة',btn:'اختاروا لونًا للمتابعة'},{e:'الخطوة الأخيرة',t:'انتقلوا إلى المحطة {station}',b:'ابحثوا في المساحة عن المحطة باللون الذي اخترتموه وتقدّموا إليها معًا.',h:'',n:'لا تتفرقوا — انطلقوا معًا كمجموعة',btn:'وصلنا إلى المحطة'}]}};let q=new URLSearchParams(location.search),lang=q.get('lang')||localStorage.getItem('thelink-lang')||'he',step=0,selected=q.get('color')||localStorage.getItem('thelink-quartet-color')||'';if(!['he','ar'].includes(lang))lang='he';if(!COLORS[selected])selected='';function render(){localStorage.setItem('thelink-lang',lang);document.documentElement.lang=lang;document.documentElement.dir='rtl';document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));let s=T[lang].steps[step],station=selected?(lang==='he'?COLORS[selected].heStation:COLORS[selected].arStation):'';stepLabel.textContent=lang==='he'?`שלב ${step+1} מתוך 3`:`المرحلة ${step+1} من 3`;family.textContent=T[lang].family;fill.style.width=`${(step+1)*33.333}%`;eyebrow.textContent=s.e;title.textContent=s.t.replace('{station}',station);body.textContent=s.b;helper.textContent=s.h||'';helper.style.display=s.h?'block':'none';note.textContent=s.n;visual.innerHTML='';if(step===0){let o=document.createElement('div');o.className='orb';o.textContent='✦';visual.appendChild(o)}if(step===1){let g=document.createElement('div');g.className='colors';Object.entries(COLORS).forEach(([k,v])=>{let b=document.createElement('button');b.className='color'+(selected===k?' selected':'');b.style.boxShadow=`inset 0 0 0 2px ${v.hex}`;b.innerHTML=`<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${v.hex};vertical-align:middle;margin-left:8px"></span>${v[lang]}`;b.onclick=()=>{selected=k;localStorage.setItem('thelink-quartet-color',k);render()};g.appendChild(b)});visual.appendChild(g)}if(step===2){let sh=document.createElement('div');sh.className='shape';let hex=COLORS[selected]?.hex||'#5aa2ff';sh.innerHTML=`<div><div class="dot" style="background:${hex}"></div><div class="station" style="background:${hex}"></div></div>`;visual.appendChild(sh)}next.textContent=s.btn;next.disabled=step===1&&!selected;let u=new URL(location.href);u.searchParams.set('lang',lang);if(selected)u.searchParams.set('color',selected);else u.searchParams.delete('color');history.replaceState(null,'',u)}document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});restart.onclick=()=>{step=0;selected='';localStorage.removeItem('thelink-quartet-color');render()};next.onclick=()=>{if(step<2){step++;render()}};render();</script></body></html>
